<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Five · Officiellt spelschema</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh}.public-wrap{max-width:1100px;margin:auto;padding:32px 18px 70px}.public-head{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.public-head h1{font-size:clamp(32px,6vw,64px);margin:8px 0}.public-head p{color:#b3c1d1}.public-brand{font-weight:900;letter-spacing:.18em;color:#ef8a42}.public-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.public-tabs button{border-radius:30px;padding:12px 22px;cursor:pointer}.public-tabs button.active{background:#ee853b;color:#0a1425}.public-section{margin-top:26px}.public-section h2{margin-bottom:15px}.schedule-table{width:100%;border-collapse:collapse}.schedule-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#9daec3;padding:12px}.schedule-table td{padding:13px 12px;border-top:1px solid #ffffff20}.schedule-table .time{font-weight:800;color:#ef8a42;white-space:nowrap}.schedule-table .pitch{font-weight:800;white-space:nowrap}.schedule-table .teams{font-weight:650}.schedule-table .group{color:#b7c5d5}.schedule-table-wrap{overflow-x:auto}.public-note{color:#b7c5d5}.group-overview{margin:26px 0 34px}.group-overview h2{margin-bottom:8px}.group-overview>p{color:#b7c5d5;margin:0 0 16px}.group-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.group-card{border:1px solid #ffffff24;border-radius:16px;padding:18px;background:#ffffff08}.group-card h3{margin:0 0 12px;color:#ef8a42}.group-team{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #ffffff16;font-weight:650}.group-rank{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:50%;background:#ffffff16;color:#fff;font-size:13px}.group-team span:last-child{overflow-wrap:anywhere}@media(max-width:580px){.group-cards{grid-template-columns:1fr}}.public-actions{display:flex;gap:12px;flex-wrap:wrap}.public-actions button{cursor:pointer}@media print{body{background:white!important;color:#101727!important}.public-tabs,.public-actions{display:none!important}.public-section{break-inside:avoid}.schedule-table td{border-color:#bbb}.schedule-table .time{color:#111}}@media(max-width:580px){.schedule-table th,.schedule-table td{padding:10px 7px;font-size:12px}}</style></head><body><div class="public-wrap"><header class="public-head"><div><div class="public-brand">SUPER FIVE · 21 NOVEMBER 2026</div><h1>Spelschema</h1><p>Ultimate Football · Upplands Väsby · Fyra planer</p></div><div class="public-actions"><button class="ghost" id="print">Skriv ut / spara PDF</button></div></header><nav class="public-tabs"><button class="active" data-phase="all">Alla matcher</button><button data-phase="groups">Grupper</button><button data-phase="final">Guld · Silver · Brons · Safir</button></nav><p id="status" class="public-note" role="status">Hämtar det aktuella spelschemat…</p><div id="groups"></div><div id="schedule"></div><p class="public-note">Spelschemat uppdateras automatiskt. Placeringsmatcher visas när gruppindelningen har publicerats.</p></div><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],phase='all';const groupOrder=['A','B','C','D','Guld','Silver','Brons','Safir'];function rankGroup(g){const games=rows.filter(m=>m.phase===(['A','B','C','D'].includes(g)?'initial':'final')&&m.group_name===g),names=[...new Set(games.flatMap(m=>[m.home,m.away]))];const stats=names.map(team=>({team,p:0,gf:0,ga:0}));for(const m of games){if(m.home_score===null||m.away_score===null)continue;const a=stats.find(x=>x.team===m.home),b=stats.find(x=>x.team===m.away);a.gf+=Number(m.home_score);a.ga+=Number(m.away_score);b.gf+=Number(m.away_score);b.ga+=Number(m.home_score);if(m.home_score>m.away_score)a.p+=3;else if(m.home_score<m.away_score)b.p+=3;else{a.p++;b.p++}}return stats.sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.team.localeCompare(b.team,'sv'))}function renderGroups(){const shown=phase==='groups'?['A','B','C','D']:phase==='final'?['Guld','Silver','Brons','Safir']:[];document.querySelector('#groups').innerHTML=shown.length?'<section class="group-overview"><h2>'+(phase==='final'?'Placeringsgrupper · aktuell ställning':'Gruppindelning · aktuell placering')+'</h2><p>Placeringarna uppdateras automatiskt efter rapporterade resultat. Poäng, mål och målskillnad visas inte.</p><div class="group-cards">'+shown.map(g=>'<div class="group-card"><h3>'+(['A','B','C','D'].includes(g)?'GRUPP ':'')+esc(g)+'</h3>'+rankGroup(g).map((x,i)=>'<div class="group-team"><span class="group-rank">'+(i+1)+'</span><span>'+esc(x.team)+'</span></div>').join('')+'</div>').join('')+'</div></section>':''}function render(){renderGroups();if(phase==='groups'){document.querySelector('#schedule').innerHTML='';return}const selected=rows.filter(x=>phase==='all'||x.phase===phase);document.querySelector('#schedule').innerHTML=groupOrder.filter(g=>selected.some(x=>x.group_name===g)).map(g=>{const matches=selected.filter(x=>x.group_name===g).sort((a,b)=>a.kickoff.localeCompare(b.kickoff)||a.pitch.localeCompare(b.pitch));return `<section class="public-section"><h2>${'ABCD'.includes(g)&&g.length===1?'Grupp '+g:g}</h2><div class="schedule-table-wrap"><table class="schedule-table"><thead><tr><th>Tid</th><th>Plan</th><th>Match</th></tr></thead><tbody>${matches.map(m=>`<tr><td class="time">${esc(m.kickoff)}</td><td class="pitch">${esc(m.pitch)}</td><td class="teams">${esc(m.home)} <span class="group">–</span> ${esc(m.away)}</td></tr>`).join('')}</tbody></table></div></section>`}).join('')||'<p class="public-note">Inga matcher publicerade i denna fas ännu.</p>';}async function refresh(){const {data,error}=await sb.rpc('public_super_five_schedule');if(error){document.querySelector('#status').textContent='Spelschemat kan inte läsas ännu. Arrangören behöver aktivera publik schemavisning.';return}rows=data||[];document.querySelector('#status').textContent=`${rows.length} matcher · Senast uppdaterat ${new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}`;render()}document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{phase=b.dataset.phase;document.querySelectorAll('[data-phase]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelector('#print').addEventListener('click',()=>window.print());refresh();setInterval(refresh,30000);</script></body></html>
